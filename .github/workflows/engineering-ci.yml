name: Engineering tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Audit npm dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Run engineering calculation tests
        run: npm test
      - name: Type-check and build web app
        run: npm run build

  orekit-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install JDK 17 with Maven dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: orekit-service/pom.xml
      - name: Compile and test real Orekit transfer solver
        run: mvn --batch-mode --no-transfer-progress -f orekit-service/pom.xml verify

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run interactive browser smoke tests
        run: npm run test:browser
      - name: Attach screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: test-results/
          retention-days: 5
