name: Engineering tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Run engineering calculation tests
        run: npm test
      - name: Type-check and build web app
        run: npm run build
